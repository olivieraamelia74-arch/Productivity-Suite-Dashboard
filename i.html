<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Productivity Suite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .bg-animation .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .glow-orb {
            position: fixed;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbPulse 4s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes orbPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 24px;
            padding: 45px 40px;
            width: 420px;
            box-shadow:
                0 25px 60px rgba(0,0,0,0.5),
                0 0 40px rgba(245,158,11,0.05),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
            animation: logoPulse 2s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .logo h1 { color: #fff; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .logo h1 span { color: #f59e0b; }
        .logo p {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 22px; position: relative; }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 42px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #f59e0b;
            background: rgba(245,158,11,0.05);
            box-shadow: 0 0 20px rgba(245,158,11,0.1);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.25); }

        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245,158,11,0.4);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login .btn-text { position: relative; z-index: 1; }
        .btn-login .btn-loader { display: none; position: relative; z-index: 1; }
        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .btn-loader { display: inline-block; }
        .btn-login.loading { opacity: 0.8; pointer-events: none; }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
                        animation: shakeX 0.5s;
        }
        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .success-msg {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.2);
            color: #22c55e;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .login-footer p {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .login-footer .version {
            color: rgba(245,158,11,0.4);
            font-size: 10px;
            margin-top: 5px;
        }

        .live-clock {
            text-align: center;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .login-container { width: 90%; padding: 30px 25px; }
        }
    </style>
</head>
<body>

    <!-- ANIMATED BACKGROUND -->
    <div class="bg-animation" id="bgAnimation"></div>
    <div class="glow-orb"></div>

    <!-- LOGIN BOX -->
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <h1><span>Stark</span> Productivity</h1>
            <p>Team Dashboard</p>
        </div>

        <div class="live-clock" id="liveClock"></div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <div class="form-group">
            <label>Alias</label>
            <div class="input-wrapper">
                <input type="text" id="loginAlias" placeholder="Enter your alias" autocomplete="off">
                <span class="icon">👤</span>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="loginPassword" placeholder="Enter password">
                <span class="icon">🔒</span>
            </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="handleLogin()">
            <span class="btn-text">Sign In →</span>
            <span class="btn-loader"><span class="spinner"></span> Authenticating...</span>
        </button>

        <div style="text-align:center; margin-top:15px;">
            <a href="#" id="forgotLink" onclick="handleForgotPassword()"
               style="color:rgba(245,158,11,0.6);font-size:12px;text-decoration:none;">
               Forgot Password?
            </a>
        </div>

        <div class="login-footer">
            <p>Authorized personnel only</p>
            <div class="version">v1.0.0 — Stark Suite</div>
        </div>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        var firebaseConfig = {
            apiKey: "AIzaSyBfQArXV1ufPc11kLZGkGygcx6y2wObUJs",
            authDomain: "productivity-suite-a0329.firebaseapp.com",
            projectId: "productivity-suite-a0329",
            storageBucket: "productivity-suite-a0329.firebasestorage.app",
            messagingSenderId: "373942539246",
            appId: "1:373942539246:web:c7875b5cec318683a674ff",
            measurementId: "G-CTBY459SLP"
        };

        var app = initializeApp(firebaseConfig);
        var auth = getAuth(app);
        var db = getFirestore(app);
                    // ===== TIMEOUT PROTECTION =====
        var pageLoadTimeout = setTimeout(function() {
            console.log('[Stark] Page load timeout - clearing auth');
            auth.signOut().catch(function(){});
        }, 15000);

        // ===== AUTO-REDIRECT IF ALREADY LOGGED IN =====
        onAuthStateChanged(auth, async function(user) {
            if (user) {
                try {
                    // ✅ FIXED: "user" (singular) not "users" (plural)
                    var userDoc = await getDoc(doc(db, "user", user.uid));
                    clearTimeout(pageLoadTimeout);
                    if (userDoc.exists()) {
                        var role = userDoc.data().role;
                        if (role === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (role === 'manager') {
                            window.location.href = 'manager.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    } else {
                        // User exists in Auth but not in Firestore
                        window.location.href = 'employee.html';
                    }
                } catch (error) {
                    clearTimeout(pageLoadTimeout);
                    console.error('[Stark] onAuthStateChanged error:', error);
                    // Don't block login on error
                }
            } else {
                clearTimeout(pageLoadTimeout);
            }
        });

        // ===== LOGIN HANDLER =====
        window.handleLogin = async function() {
            var alias = document.getElementById('loginAlias').value.trim();
            var password = document.getElementById('loginPassword').value;
            var errorMsg = document.getElementById('errorMsg');
            var successMsg = document.getElementById('successMsg');
            var loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!alias || !password) {
                errorMsg.textContent = '⚠️ Please enter both alias and password';
                errorMsg.style.display = 'block';
                return;
            }

            // ✅ Convert alias to lowercase to prevent case-sensitive issues
            alias = alias.toLowerCase();

            // Convert alias to email format
            var email = alias;
                        if (alias.indexOf('@') === -1) {
                email = alias + '@starkteam.com';
            }

            loginBtn.classList.add('loading');

            try {
                var userCredential = await signInWithEmailAndPassword(auth, email, password);

                // ✅ FIXED: "user" (singular) not "users" (plural)
                var userDoc = await getDoc(doc(db, "user", userCredential.user.uid));

                successMsg.textContent = '✅ Welcome back! Redirecting...';
                successMsg.style.display = 'block';

                if (userDoc.exists()) {
                    var role = userDoc.data().role;
                    setTimeout(function() {
                        if (role === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (role === 'manager') {
                            window.location.href = 'manager.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }, 1000);
                } else {
                    // User exists in Auth but not in Firestore
                    setTimeout(function() {
                        window.location.href = 'employee.html';
                    }, 1000);
                }

            } catch (error) {
                loginBtn.classList.remove('loading');
                if (error.code === 'auth/user-not-found' ||
                    error.code === 'auth/invalid-credential') {
                    errorMsg.textContent = '❌ Invalid alias or password';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg.textContent = '❌ Incorrect password';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg.textContent = '⏳ Too many attempts. Please wait a moment.';
                } else {
                    errorMsg.textContent = '❌ Login failed: ' + error.message;
                }
                errorMsg.style.display = 'block';
            }
        };

        // ===== FORGOT PASSWORD =====
        window.handleForgotPassword = async function() {
            var alias = document.getElementById('loginAlias').value.trim();
            var errorMsg = document.getElementById('errorMsg');
            var successMsg = document.getElementById('successMsg');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!alias) {
                errorMsg.textContent = '⚠️ Please enter your alias first, then click Forgot Password';
                errorMsg.style.display = 'block';
                return;
            }

            // ✅ Convert alias to lowercase
            alias = alias.toLowerCase();

            var email = alias;
            if (alias.indexOf('@') === -1) {
                email = alias + '@starkteam.com';
            }

            try {
                await sendPasswordResetEmail(auth, email);
                successMsg.textContent = '📧 Password reset email sent to ' + email + '. Check your inbox!';
                successMsg.style.display = 'block';
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    errorMsg.textContent = '❌ No account found with this alias';
                } else {
                    errorMsg.textContent = '❌ Error: ' + error.message;
                }
                errorMsg.style.display = 'block';
            }
        };

        // ===== ENTER KEY SUPPORT =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { handleLogin(); }
        });

        // ===== LIVE CLOCK =====
        function updateClock() {
            var now = new Date();
            var options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            var date = now.toLocaleDateString('en-US', options);
            var time = now.toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            document.getElementById('liveClock').textContent = date + ' • ' + time;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ===== FLOATING PARTICLES =====
        function createParticles() {
            var container = document.getElementById('bgAnimation');
            for (var i = 0; i < 30; i++) {
                var particle = document.createElement('div');
                particle.classList.add('particle');
                var size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

    </script>
</body>
</html>
